name: CI/CD

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:

  build-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Make Maven wrappers executable
        run: chmod +x order-service/mvnw payment-service/mvnw inventory-service/mvnw gateway/mvnw

      - name: Build order-service
        run: cd order-service && ./mvnw package -DskipTests

      - name: Build payment-service
        run: cd payment-service && ./mvnw package -DskipTests

      - name: Build inventory-service
        run: cd inventory-service && ./mvnw package -DskipTests

      - name: Build gateway
        run: cd gateway && ./mvnw package -DskipTests

      - name: Test order-service
        run: |
          if find order-service/src/test -name "*.java" | grep -q .; then
            cd order-service && ./mvnw verify -DskipCompile
          else
            echo "No tests found, skipping"
          fi

      - name: Test payment-service
        run: |
          if find payment-service/src/test -name "*.java" | grep -q .; then
            cd payment-service && ./mvnw verify -DskipCompile
          else
            echo "No tests found, skipping"
          fi

      - name: Test inventory-service
        run: |
          if find inventory-service/src/test -name "*.java" | grep -q .; then
            cd inventory-service && ./mvnw verify -DskipCompile
          else
            echo "No tests found, skipping"
          fi

      - name: Test gateway
        run: |
          if find gateway/src/test -name "*.java" | grep -q .; then
            cd gateway && ./mvnw verify -DskipCompile
          else
            echo "No tests found, skipping"
          fi

      - name: Upload order-service artifact
        uses: actions/upload-artifact@v4
        with:
          name: order-service
          path: order-service/target/quarkus-app/

      - name: Upload payment-service artifact
        uses: actions/upload-artifact@v4
        with:
          name: payment-service
          path: payment-service/target/quarkus-app/

      - name: Upload inventory-service artifact
        uses: actions/upload-artifact@v4
        with:
          name: inventory-service
          path: inventory-service/target/quarkus-app/

      - name: Upload gateway artifact
        uses: actions/upload-artifact@v4
        with:
          name: gateway
          path: gateway/target/quarkus-app/

  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Build
        run: cd frontend && npm run build

      - name: Test
        run: |
          if grep -q '"test"' frontend/package.json; then
            cd frontend && npm test -- --watch=false
          else
            echo "No tests found, skipping"
          fi

  docker-push:
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v4

      - name: Download order-service artifact
        uses: actions/download-artifact@v4
        with:
          name: order-service
          path: order-service/target/quarkus-app/

      - name: Download payment-service artifact
        uses: actions/download-artifact@v4
        with:
          name: payment-service
          path: payment-service/target/quarkus-app/

      - name: Download inventory-service artifact
        uses: actions/download-artifact@v4
        with:
          name: inventory-service
          path: inventory-service/target/quarkus-app/

      - name: Download gateway artifact
        uses: actions/download-artifact@v4
        with:
          name: gateway
          path: gateway/target/quarkus-app/

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push order-service
        uses: docker/build-push-action@v6
        with:
          context: order-service
          file: order-service/src/main/docker/Dockerfile.jvm
          push: true
          tags: |
            tbzowka/order-service:latest
            tbzowka/order-service:${{ github.sha }}

      - name: Build and push payment-service
        uses: docker/build-push-action@v6
        with:
          context: payment-service
          file: payment-service/src/main/docker/Dockerfile.jvm
          push: true
          tags: |
            tbzowka/payment-service:latest
            tbzowka/payment-service:${{ github.sha }}

      - name: Build and push inventory-service
        uses: docker/build-push-action@v6
        with:
          context: inventory-service
          file: inventory-service/src/main/docker/Dockerfile.jvm
          push: true
          tags: |
            tbzowka/inventory-service:latest
            tbzowka/inventory-service:${{ github.sha }}

      - name: Build and push gateway
        uses: docker/build-push-action@v6
        with:
          context: gateway
          file: gateway/src/main/docker/Dockerfile.jvm
          push: true
          tags: |
            tbzowka/gateway:latest
            tbzowka/gateway:${{ github.sha }}

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/Dockerfile
          push: true
          tags: |
            tbzowka/frontend:latest
            tbzowka/frontend:${{ github.sha }}