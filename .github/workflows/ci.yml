name: CI/CD

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:

  build-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Make Maven wrappers executable
        run: chmod +x order-service/mvnw payment-service/mvnw inventory-service/mvnw gateway/mvnw product-service/mvnw

      - name: Build order-service
        run: cd order-service && ./mvnw package -DskipTests

      - name: Build payment-service
        run: cd payment-service && ./mvnw package -DskipTests

      - name: Build inventory-service
        run: cd inventory-service && ./mvnw package -DskipTests

      - name: Build gateway
        run: cd gateway && ./mvnw package -DskipTests

      - name: Build product-service
        run: cd product-service && ./mvnw package -DskipTests

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Test order-service
        run: cd order-service && ./mvnw test

      - name: Test payment-service
        run: cd payment-service && ./mvnw test

      - name: Test inventory-service
        run: cd inventory-service && ./mvnw test

      - name: Test gateway
        run: |
          if find gateway/src/test -name "*.java" | grep -q .; then
            cd gateway && ./mvnw test
          else
            echo "No tests found, skipping"
          fi

      - name: Test product-service
        run: cd product-service && ./mvnw test

      - name: Cache compiled artifacts
        uses: actions/cache/save@v4
        with:
          path: |
            order-service/target/quarkus-app/
            payment-service/target/quarkus-app/
            inventory-service/target/quarkus-app/
            gateway/target/quarkus-app/
            product-service/target/
          key: compiled-${{ github.sha }}

  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Build
        run: cd frontend && npm run build

      - name: Test
        run: |
          if grep -q '"test"' frontend/package.json; then
            cd frontend && npm test -- --watch=false
          else
            echo "No tests found, skipping"
          fi

  docker-push:
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v4

      - name: Restore compiled artifacts
        uses: actions/cache/restore@v4
        with:
          path: |
            order-service/target/quarkus-app/
            payment-service/target/quarkus-app/
            inventory-service/target/quarkus-app/
            gateway/target/quarkus-app/
            product-service/target/
          key: compiled-${{ github.sha }}

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push order-service
        uses: docker/build-push-action@v6
        with:
          context: order-service
          file: order-service/src/main/docker/Dockerfile.jvm
          push: true
          tags: |
            tbzowka/order-service:latest
            tbzowka/order-service:${{ github.sha }}

      - name: Build and push payment-service
        uses: docker/build-push-action@v6
        with:
          context: payment-service
          file: payment-service/src/main/docker/Dockerfile.jvm
          push: true
          tags: |
            tbzowka/payment-service:latest
            tbzowka/payment-service:${{ github.sha }}

      - name: Build and push inventory-service
        uses: docker/build-push-action@v6
        with:
          context: inventory-service
          file: inventory-service/src/main/docker/Dockerfile.jvm
          push: true
          tags: |
            tbzowka/inventory-service:latest
            tbzowka/inventory-service:${{ github.sha }}

      - name: Build and push gateway
        uses: docker/build-push-action@v6
        with:
          context: gateway
          file: gateway/src/main/docker/Dockerfile.jvm
          push: true
          tags: |
            tbzowka/gateway:latest
            tbzowka/gateway:${{ github.sha }}

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/Dockerfile
          push: true
          tags: |
            tbzowka/frontend:latest
            tbzowka/frontend:${{ github.sha }}

      - name: Build and push product-service
        uses: docker/build-push-action@v6
        with:
          context: product-service
          file: product-service/Dockerfile
          push: true
          tags: |
            tbzowka/product-service:latest
            tbzowka/product-service:${{ github.sha }}

  update-manifests:
    runs-on: ubuntu-latest
    needs: [docker-push]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - name: Pin app manifests to this commit's image tag
        run: |
          for svc in order-service payment-service inventory-service gateway product-service frontend; do
            sed -i "s#image: tbzowka/${svc}:.*#image: tbzowka/${svc}:${{ github.sha }}#" "k8s/app/${svc}-deployment.yaml"
          done

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add k8s/app/*.yaml
          if git diff --cached --quiet; then
            echo "No manifest changes"
          else
            git commit -m "chore: pin k8s app images to ${{ github.sha }} [skip ci]"
            git push origin master
          fi
