services:

  kafka:
    image: apache/kafka:latest
    ports:
      - "9092:9092"
    environment:
      - KAFKA_NODE_ID=0
      - KAFKA_PROCESS_ROLES=controller,broker
      - KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CONTROLLER_QUORUM_VOTERS=0@kafka:9093
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
      - CLUSTER_ID=MkU3OEVBNTcwNTJENDM2Qk
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 15s

  apicurio-registry:
    image: quay.io/apicurio/apicurio-registry:3.1.7.Final
    ports:
      - "8091:8080"
    environment:
      QUARKUS_PROFILE: dev
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  postgres:
    image: postgres:18
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  order-service:
    image: tbzowka/order-service:latest
    pull_policy: always
    build:
      context: order-service
      dockerfile: src/main/docker/Dockerfile.jvm
    ports:
      - "8080:8080"
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
      apicurio-registry:
        condition: service_healthy

  payment-service:
    image: tbzowka/payment-service:latest
    pull_policy: always
    build:
      context: payment-service
      dockerfile: src/main/docker/Dockerfile.jvm
    ports:
      - "8081:8081"
    depends_on:
      kafka:
        condition: service_healthy
      apicurio-registry:
        condition: service_healthy

  inventory-service:
    image: tbzowka/inventory-service:latest
    pull_policy: always
    build:
      context: inventory-service
      dockerfile: src/main/docker/Dockerfile.jvm
    ports:
      - "8082:8082"
    depends_on:
      kafka:
        condition: service_healthy
      apicurio-registry:
        condition: service_healthy

  keycloak:
    image: quay.io/keycloak/keycloak:26.2
    command: start-dev --import-realm
    ports:
      - "8180:8080"
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    volumes:
      - ./keycloak/shopflow-realm.json:/opt/keycloak/data/import/shopflow-realm.json
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080"]
      interval: 15s
      timeout: 5s
      retries: 15
      start_period: 30s

  gateway:
    image: tbzowka/gateway:latest
    pull_policy: always
    build:
      context: gateway
      dockerfile: src/main/docker/Dockerfile.jvm
    ports:
      - "8090:8090"
    depends_on:
      order-service:
        condition: service_started
      inventory-service:
        condition: service_started
      keycloak:
        condition: service_healthy

  frontend:
    image: tbzowka/frontend:latest
    pull_policy: always
    build:
      context: frontend
      dockerfile: Dockerfile
    ports:
      - "4200:80"
    depends_on:
      - gateway

volumes:
  postgres-data:
