quarkus.http.port=8090
quarkus.http.host=localhost
quarkus.http.test-port=8093

quarkus.log.console.format=%d{HH:mm:ss} %-5p [%c] [corrId=%X{correlationId}] [thread=%t] %s%e%n

quarkus.smallrye-openapi.enabled=true
quarkus.smallrye-openapi.path=/openapi
quarkus.smallrye-openapi.version=1.0.0
quarkus.smallrye-openapi.title=ShopFlow Gateway API
quarkus.smallrye-openapi.description=API Gateway for the ShopFlow platform

quarkus.rest-client."com.example.gateway.client.OrderServiceClient".url=http://localhost:8080
quarkus.rest-client."com.example.gateway.client.OrderServiceClient".scope=jakarta.inject.Singleton

quarkus.rest-client."com.example.gateway.client.InventoryServiceClient".url=http://localhost:8082
quarkus.rest-client."com.example.gateway.client.InventoryServiceClient".scope=jakarta.inject.Singleton

# OIDC — dev profile: Dev Services auto-starts Keycloak with realm file
quarkus.keycloak.devservices.realm-path=keycloak/shopflow-realm.json
quarkus.keycloak.devservices.port=8180
quarkus.keycloak.devservices.shared=true
quarkus.keycloak.devservices.start-timeout=180s
quarkus.oidc.application-type=service
quarkus.oidc.client-id=shopflow-app

%prod.quarkus.http.host=0.0.0.0
%prod.quarkus.rest-client."com.example.gateway.client.OrderServiceClient".url=http://order-service:8080
%prod.quarkus.rest-client."com.example.gateway.client.InventoryServiceClient".url=http://inventory-service:8082
%prod.quarkus.oidc.auth-server-url=http://keycloak:8080/realms/shopflow
