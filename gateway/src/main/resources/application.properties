quarkus.http.port=8090
quarkus.http.host=localhost
quarkus.http.test-port=8093

quarkus.log.console.format=%d{HH:mm:ss} %-5p [gateway] [%c{1}] [corrId=%X{correlationId}] [orderId=%X{orderId}] %s%e%n

quarkus.smallrye-openapi.enabled=true
quarkus.smallrye-openapi.path=/openapi
quarkus.smallrye-openapi.version=1.0.0
quarkus.smallrye-openapi.title=ShopFlow Gateway API
quarkus.smallrye-openapi.description=API Gateway for the ShopFlow platform
quarkus.swagger-ui.always-include=true

quarkus.rest-client.order-service.url=http://localhost:8080
quarkus.rest-client.order-service.scope=jakarta.inject.Singleton
quarkus.rest-client.order-service.connect-timeout=1000
quarkus.rest-client.order-service.read-timeout=3000

quarkus.rest-client.inventory-service.url=http://localhost:8082
quarkus.rest-client.inventory-service.scope=jakarta.inject.Singleton
quarkus.rest-client.inventory-service.connect-timeout=1000
quarkus.rest-client.inventory-service.read-timeout=3000

quarkus.rest-client.payment-service.url=http://localhost:8081
quarkus.rest-client.payment-service.scope=jakarta.inject.Singleton
quarkus.rest-client.payment-service.connect-timeout=1000
quarkus.rest-client.payment-service.read-timeout=3000

quarkus.rest-client.product-service.url=http://localhost:8084
quarkus.rest-client.product-service.scope=jakarta.inject.Singleton
quarkus.rest-client.product-service.connect-timeout=1000
quarkus.rest-client.product-service.read-timeout=10000

# OIDC — dev profile: Dev Services auto-starts Keycloak with realm file
quarkus.keycloak.devservices.realm-path=keycloak/shopflow-realm.json
quarkus.keycloak.devservices.port=8180
quarkus.keycloak.devservices.shared=true
quarkus.keycloak.devservices.start-timeout=180s
quarkus.oidc.application-type=service
quarkus.oidc.client-id=shopflow-app

%prod.quarkus.http.host=0.0.0.0
%prod.quarkus.rest-client.order-service.url=http://order-service:8080
%prod.quarkus.rest-client.inventory-service.url=http://inventory-service:8082
%prod.quarkus.rest-client.payment-service.url=http://payment-service:8081
%prod.quarkus.rest-client.product-service.url=http://product-service:8084
%prod.quarkus.oidc.auth-server-url=http://keycloak:8080/realms/shopflow
# Token iss claim uses localhost:8180 (external URL) but gateway discovers Keycloak via keycloak:8080 (internal URL)
%prod.quarkus.oidc.token.issuer=any
