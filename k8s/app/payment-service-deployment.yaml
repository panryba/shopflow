# No env vars needed — %prod.* config already hardcodes kafka:9092,
# apicurio-registry:8080 and keycloak:8080, matching these Service names.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
  namespace: shopflow
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: payment-service
  template:
    metadata:
      labels:
        app: payment-service
    spec:
      initContainers:
        - name: wait-for-kafka
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z kafka 9092; do echo waiting for kafka; sleep 2; done"]
        - name: wait-for-apicurio
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z apicurio-registry 8080; do echo waiting for apicurio-registry; sleep 2; done"]
      containers:
        - name: payment-service
          image: tbzowka/payment-service:5c01e159878954296782424173f49b3d8a63dfac
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          startupProbe:
            httpGet:
              path: /q/health/ready
              port: 8081
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: 8081
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /q/health/ready
              port: 8081
            periodSeconds: 5