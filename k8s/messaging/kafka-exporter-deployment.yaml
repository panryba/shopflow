apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-exporter
  namespace: shopflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka-exporter
  template:
    metadata:
      labels:
        app: kafka-exporter
    spec:
      # kafka-exporter exits fatally on startup if it can't reach the broker
      # (no built-in retry), so it needs the same dependency wait order-/
      # payment-/inventory-service already have.
      initContainers:
        - name: wait-for-kafka
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z kafka 9092; do echo waiting for kafka; sleep 2; done"]
      containers:
        - name: kafka-exporter
          image: danielqsj/kafka-exporter:latest
          args:
            - --kafka.server=kafka:9092
          ports:
            - containerPort: 9308
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
          # kafka-exporter has no health endpoint; a TCP check on its own
          # listening port is the best available signal.
          livenessProbe:
            tcpSocket:
              port: 9308
            initialDelaySeconds: 15
            periodSeconds: 15
          readinessProbe:
            tcpSocket:
              port: 9308
            initialDelaySeconds: 10
            periodSeconds: 10