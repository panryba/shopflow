# prometheus-config ConfigMap is generated from monitoring/prometheus/prometheus.yml
# — see k8s/README.md "Manual Deployment" — rather than duplicated into this
# manifest, so the scrape targets can't drift from the docker-compose version. Its targets
# already use the same ports as this k8s app tier (order-service:8080,
# payment-service:8081, inventory-service:8082, gateway:8090,
# product-service:8084 on /actuator/prometheus, kafka-exporter:9308).
#
# No PVC: docker-compose.yml doesn't persist Prometheus data either (ephemeral
# by design here), so this matches that.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: shopflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v3.11.3
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.retention.time=7d
          ports:
            - containerPort: 9090
          volumeMounts:
            - name: prometheus-config
              mountPath: /etc/prometheus
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: 9090
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /-/ready
              port: 9090
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
      volumes:
        - name: prometheus-config
          configMap:
            name: prometheus-config