quarkus.http.port=8080
quarkus.http.host=localhost
quarkus.http.test-port=8083

quarkus.log.console.format=%d{HH:mm:ss} %-5p [order-service] [%c{1}] [corrId=%X{correlationId}] [orderId=%X{orderId}] %s%e%n

quarkus.smallrye-openapi.enabled=true
quarkus.smallrye-openapi.path=/openapi
quarkus.smallrye-openapi.version=1.0.0
quarkus.smallrye-openapi.title=Order Service API
quarkus.smallrye-openapi.description=API documentation for Order Service

quarkus.datasource.db-kind=postgresql
%dev.quarkus.datasource.devservices.port=5432
quarkus.datasource.devservices.username=postgres
quarkus.datasource.devservices.password=postgres
quarkus.datasource.devservices.db-name=postgres

%dev.quarkus.hibernate-orm.schema-management.strategy=drop-and-create
%dev.quarkus.flyway.enabled=false
%dev.quarkus.keycloak.devservices.enabled=false
%dev.mp.jwt.verify.issuer=http://localhost:8180/realms/shopflow
%dev.mp.jwt.verify.publickey.location=http://localhost:8180/realms/shopflow/protocol/openid-connect/certs
smallrye.jwt.path.groups=realm_access/roles

%test.quarkus.hibernate-orm.schema-management.strategy=drop-and-create
%test.quarkus.flyway.enabled=false

%prod.quarkus.hibernate-orm.schema-management.strategy=validate
%prod.quarkus.flyway.migrate-at-start=true
%prod.quarkus.flyway.locations=classpath:db/migration

app.roles.admin=admin

app.saga.step-timeout-seconds=30
app.saga.retention-days=3

app.inbox.retention-days=30

app.outbox.batch-size=50
app.outbox.max-retries=5
app.outbox.retention-days=30

# ─── Schema Registry ───────────────────────────────────────────────────────────
quarkus.kafka.devservices.shared=true
%dev.quarkus.apicurio-registry.devservices.port=8091
quarkus.apicurio-registry.devservices.shared=true
%prod.kafka.bootstrap.servers=kafka:9092
%prod.mp.messaging.connector.smallrye-kafka.apicurio.registry.url=http://apicurio-registry:8080
%prod.quarkus.datasource.jdbc.url=jdbc:postgresql://postgres:5432/postgres
%prod.quarkus.datasource.username=postgres
%prod.quarkus.datasource.password=postgres

%prod.mp.jwt.verify.issuer=http://localhost:8180/realms/shopflow
%prod.mp.jwt.verify.publickey.location=http://keycloak:8080/realms/shopflow/protocol/openid-connect/certs

# ─── Producers ─────────────────────────────────────────────────────────────────
mp.messaging.outgoing.payment-request.connector=smallrye-kafka
mp.messaging.outgoing.payment-request.topic=payment-request
mp.messaging.outgoing.payment-request.value.serializer=io.apicurio.registry.serde.avro.AvroKafkaSerializer
mp.messaging.outgoing.payment-request.apicurio.registry.auto-register=true
mp.messaging.outgoing.payment-request.apicurio.registry.artifact-id=payment-request-value

mp.messaging.outgoing.inventory-request.connector=smallrye-kafka
mp.messaging.outgoing.inventory-request.topic=inventory-request
mp.messaging.outgoing.inventory-request.value.serializer=io.apicurio.registry.serde.avro.AvroKafkaSerializer
mp.messaging.outgoing.inventory-request.apicurio.registry.auto-register=true
mp.messaging.outgoing.inventory-request.apicurio.registry.artifact-id=inventory-request-value

mp.messaging.outgoing.payment-rollback.connector=smallrye-kafka
mp.messaging.outgoing.payment-rollback.topic=payment-rollback
mp.messaging.outgoing.payment-rollback.value.serializer=io.apicurio.registry.serde.avro.AvroKafkaSerializer
mp.messaging.outgoing.payment-rollback.apicurio.registry.auto-register=true
mp.messaging.outgoing.payment-rollback.apicurio.registry.artifact-id=payment-rollback-value

# ─── Consumers ─────────────────────────────────────────────────────────────────
mp.messaging.incoming.payment-completed.connector=smallrye-kafka
mp.messaging.incoming.payment-completed.topic=payment-completed
mp.messaging.incoming.payment-completed.group.id=order-service
mp.messaging.incoming.payment-completed.value.deserializer=io.apicurio.registry.serde.avro.AvroKafkaDeserializer
mp.messaging.incoming.payment-completed.apicurio.registry.use-specific-avro-reader=true
mp.messaging.incoming.payment-completed.failure-strategy=dead-letter-queue
mp.messaging.incoming.payment-completed.dead-letter-queue.topic=payment-completed-dlq
mp.messaging.incoming.payment-completed.dead-letter-queue.value.serializer=org.apache.kafka.common.serialization.ByteArraySerializer
mp.messaging.incoming.payment-completed.max-retries=5
mp.messaging.incoming.payment-completed.retry-backoff.initial=1s
mp.messaging.incoming.payment-completed.retry-backoff.max=30s
mp.messaging.incoming.payment-completed.retry-backoff.factor=2.0

mp.messaging.incoming.payment-failed.connector=smallrye-kafka
mp.messaging.incoming.payment-failed.topic=payment-failed
mp.messaging.incoming.payment-failed.group.id=order-service
mp.messaging.incoming.payment-failed.value.deserializer=io.apicurio.registry.serde.avro.AvroKafkaDeserializer
mp.messaging.incoming.payment-failed.apicurio.registry.use-specific-avro-reader=true
mp.messaging.incoming.payment-failed.failure-strategy=dead-letter-queue
mp.messaging.incoming.payment-failed.dead-letter-queue.topic=payment-failed-dlq
mp.messaging.incoming.payment-failed.dead-letter-queue.value.serializer=org.apache.kafka.common.serialization.ByteArraySerializer
mp.messaging.incoming.payment-failed.max-retries=5
mp.messaging.incoming.payment-failed.retry-backoff.initial=1s
mp.messaging.incoming.payment-failed.retry-backoff.max=30s
mp.messaging.incoming.payment-failed.retry-backoff.factor=2.0

mp.messaging.incoming.inventory-approved.connector=smallrye-kafka
mp.messaging.incoming.inventory-approved.topic=inventory-approved
mp.messaging.incoming.inventory-approved.group.id=order-service
mp.messaging.incoming.inventory-approved.value.deserializer=io.apicurio.registry.serde.avro.AvroKafkaDeserializer
mp.messaging.incoming.inventory-approved.apicurio.registry.use-specific-avro-reader=true
mp.messaging.incoming.inventory-approved.failure-strategy=dead-letter-queue
mp.messaging.incoming.inventory-approved.dead-letter-queue.topic=inventory-approved-dlq
mp.messaging.incoming.inventory-approved.dead-letter-queue.value.serializer=org.apache.kafka.common.serialization.ByteArraySerializer
mp.messaging.incoming.inventory-approved.max-retries=5
mp.messaging.incoming.inventory-approved.retry-backoff.initial=1s
mp.messaging.incoming.inventory-approved.retry-backoff.max=30s
mp.messaging.incoming.inventory-approved.retry-backoff.factor=2.0

mp.messaging.incoming.inventory-rejected.connector=smallrye-kafka
mp.messaging.incoming.inventory-rejected.topic=inventory-rejected
mp.messaging.incoming.inventory-rejected.group.id=order-service
mp.messaging.incoming.inventory-rejected.value.deserializer=io.apicurio.registry.serde.avro.AvroKafkaDeserializer
mp.messaging.incoming.inventory-rejected.apicurio.registry.use-specific-avro-reader=true
mp.messaging.incoming.inventory-rejected.failure-strategy=dead-letter-queue
mp.messaging.incoming.inventory-rejected.dead-letter-queue.topic=inventory-rejected-dlq
mp.messaging.incoming.inventory-rejected.dead-letter-queue.value.serializer=org.apache.kafka.common.serialization.ByteArraySerializer
mp.messaging.incoming.inventory-rejected.max-retries=5
mp.messaging.incoming.inventory-rejected.retry-backoff.initial=1s
mp.messaging.incoming.inventory-rejected.retry-backoff.max=30s
mp.messaging.incoming.inventory-rejected.retry-backoff.factor=2.0

mp.messaging.incoming.payment-rollback-completed.connector=smallrye-kafka
mp.messaging.incoming.payment-rollback-completed.topic=payment-rollback-completed
mp.messaging.incoming.payment-rollback-completed.group.id=order-service
mp.messaging.incoming.payment-rollback-completed.value.deserializer=io.apicurio.registry.serde.avro.AvroKafkaDeserializer
mp.messaging.incoming.payment-rollback-completed.apicurio.registry.use-specific-avro-reader=true
mp.messaging.incoming.payment-rollback-completed.failure-strategy=dead-letter-queue
mp.messaging.incoming.payment-rollback-completed.dead-letter-queue.topic=payment-rollback-completed-dlq
mp.messaging.incoming.payment-rollback-completed.dead-letter-queue.value.serializer=org.apache.kafka.common.serialization.ByteArraySerializer
mp.messaging.incoming.payment-rollback-completed.max-retries=5
mp.messaging.incoming.payment-rollback-completed.retry-backoff.initial=1s
mp.messaging.incoming.payment-rollback-completed.retry-backoff.max=30s
mp.messaging.incoming.payment-rollback-completed.retry-backoff.factor=2.0

# ─── Test profile ─────────────────────────────────────────────────────────────
# Scheduler off: OutboxPublisherJob and SagaTimeoutJob must not fire automatically;
# integration tests drive saga transitions and timeout checks directly.
%test.quarkus.scheduler.enabled=false
