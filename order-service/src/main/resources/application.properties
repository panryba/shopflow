quarkus.http.port=8080
quarkus.log.console.format=%d{HH:mm:ss} %-5p [%c] [corrId=%X{correlationId}] [orderId=%X{orderId}] [thread=%t] %s%e%n
quarkus.kafka.devservices.shared=true
quarkus.http.host=localhost
quarkus.http.test-port=8083

quarkus.smallrye-openapi.enabled=true
quarkus.smallrye-openapi.path=/openapi
quarkus.smallrye-openapi.version=1.0.0
quarkus.smallrye-openapi.title=Order Service API
quarkus.smallrye-openapi.description=API documentation for Order Service

quarkus.datasource.db-kind=postgresql
quarkus.datasource.devservices.port=5432
quarkus.datasource.devservices.username=postgres
quarkus.datasource.devservices.password=postgres
quarkus.datasource.devservices.db-name=postgres

%dev.quarkus.hibernate-orm.schema-management.strategy=drop-and-create
%dev.quarkus.flyway.enabled=false

%test.quarkus.hibernate-orm.schema-management.strategy=drop-and-create
%test.quarkus.flyway.enabled=false

%prod.quarkus.hibernate-orm.schema-management.strategy=validate
%prod.quarkus.flyway.migrate-at-start=true
%prod.quarkus.flyway.locations=classpath:db/migration

app.idempotency.retention-days=7

app.outbox.batch-size=50
app.outbox.max-retries=5
app.outbox.retention-days=7

# ─── Schema Registry ───────────────────────────────────────────────────────────
quarkus.apicurio-registry.devservices.port=8091
quarkus.apicurio-registry.devservices.shared=true
%prod.mp.messaging.connector.smallrye-kafka.apicurio.registry.url=http://apicurio-registry:8091

# ─── Producers ─────────────────────────────────────────────────────────────────
mp.messaging.outgoing.payment-request.connector=smallrye-kafka
mp.messaging.outgoing.payment-request.topic=payment-request
mp.messaging.outgoing.payment-request.value.serializer=io.apicurio.registry.serde.avro.AvroKafkaSerializer
mp.messaging.outgoing.payment-request.apicurio.registry.auto-register=true
mp.messaging.outgoing.payment-request.apicurio.registry.artifact-id=payment-request-value

mp.messaging.outgoing.restaurant-request.connector=smallrye-kafka
mp.messaging.outgoing.restaurant-request.topic=restaurant-request
mp.messaging.outgoing.restaurant-request.value.serializer=io.apicurio.registry.serde.avro.AvroKafkaSerializer
mp.messaging.outgoing.restaurant-request.apicurio.registry.auto-register=true
mp.messaging.outgoing.restaurant-request.apicurio.registry.artifact-id=restaurant-request-value

mp.messaging.outgoing.payment-rollback.connector=smallrye-kafka
mp.messaging.outgoing.payment-rollback.topic=payment-rollback
mp.messaging.outgoing.payment-rollback.value.serializer=io.apicurio.registry.serde.avro.AvroKafkaSerializer
mp.messaging.outgoing.payment-rollback.apicurio.registry.auto-register=true
mp.messaging.outgoing.payment-rollback.apicurio.registry.artifact-id=payment-rollback-value

# ─── Consumers ─────────────────────────────────────────────────────────────────
mp.messaging.incoming.payment-completed.connector=smallrye-kafka
mp.messaging.incoming.payment-completed.topic=payment-completed
mp.messaging.incoming.payment-completed.group.id=order-service
mp.messaging.incoming.payment-completed.value.deserializer=io.apicurio.registry.serde.avro.AvroKafkaDeserializer
mp.messaging.incoming.payment-completed.apicurio.registry.use-specific-avro-reader=true
mp.messaging.incoming.payment-completed.failure-strategy=dead-letter-queue
mp.messaging.incoming.payment-completed.dead-letter-queue.topic=payment-completed-dlq
mp.messaging.incoming.payment-completed.dead-letter-queue.value.serializer=org.apache.kafka.common.serialization.ByteArraySerializer
mp.messaging.incoming.payment-completed.max-retries=5
mp.messaging.incoming.payment-completed.retry-backoff.initial=1s
mp.messaging.incoming.payment-completed.retry-backoff.max=30s
mp.messaging.incoming.payment-completed.retry-backoff.factor=2.0

mp.messaging.incoming.payment-failed.connector=smallrye-kafka
mp.messaging.incoming.payment-failed.topic=payment-failed
mp.messaging.incoming.payment-failed.group.id=order-service
mp.messaging.incoming.payment-failed.value.deserializer=io.apicurio.registry.serde.avro.AvroKafkaDeserializer
mp.messaging.incoming.payment-failed.apicurio.registry.use-specific-avro-reader=true
mp.messaging.incoming.payment-failed.failure-strategy=dead-letter-queue
mp.messaging.incoming.payment-failed.dead-letter-queue.topic=payment-failed-dlq
mp.messaging.incoming.payment-failed.dead-letter-queue.value.serializer=org.apache.kafka.common.serialization.ByteArraySerializer
mp.messaging.incoming.payment-failed.max-retries=5
mp.messaging.incoming.payment-failed.retry-backoff.initial=1s
mp.messaging.incoming.payment-failed.retry-backoff.max=30s
mp.messaging.incoming.payment-failed.retry-backoff.factor=2.0

mp.messaging.incoming.restaurant-approved.connector=smallrye-kafka
mp.messaging.incoming.restaurant-approved.topic=restaurant-approved
mp.messaging.incoming.restaurant-approved.group.id=order-service
mp.messaging.incoming.restaurant-approved.value.deserializer=io.apicurio.registry.serde.avro.AvroKafkaDeserializer
mp.messaging.incoming.restaurant-approved.apicurio.registry.use-specific-avro-reader=true
mp.messaging.incoming.restaurant-approved.failure-strategy=dead-letter-queue
mp.messaging.incoming.restaurant-approved.dead-letter-queue.topic=restaurant-approved-dlq
mp.messaging.incoming.restaurant-approved.dead-letter-queue.value.serializer=org.apache.kafka.common.serialization.ByteArraySerializer
mp.messaging.incoming.restaurant-approved.max-retries=5
mp.messaging.incoming.restaurant-approved.retry-backoff.initial=1s
mp.messaging.incoming.restaurant-approved.retry-backoff.max=30s
mp.messaging.incoming.restaurant-approved.retry-backoff.factor=2.0

mp.messaging.incoming.restaurant-rejected.connector=smallrye-kafka
mp.messaging.incoming.restaurant-rejected.topic=restaurant-rejected
mp.messaging.incoming.restaurant-rejected.group.id=order-service
mp.messaging.incoming.restaurant-rejected.value.deserializer=io.apicurio.registry.serde.avro.AvroKafkaDeserializer
mp.messaging.incoming.restaurant-rejected.apicurio.registry.use-specific-avro-reader=true
mp.messaging.incoming.restaurant-rejected.failure-strategy=dead-letter-queue
mp.messaging.incoming.restaurant-rejected.dead-letter-queue.topic=restaurant-rejected-dlq
mp.messaging.incoming.restaurant-rejected.dead-letter-queue.value.serializer=org.apache.kafka.common.serialization.ByteArraySerializer
mp.messaging.incoming.restaurant-rejected.max-retries=5
mp.messaging.incoming.restaurant-rejected.retry-backoff.initial=1s
mp.messaging.incoming.restaurant-rejected.retry-backoff.max=30s
mp.messaging.incoming.restaurant-rejected.retry-backoff.factor=2.0
