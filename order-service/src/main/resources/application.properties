mp.messaging.incoming.payment-failed.dead-letter-queue.key.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.incoming.payment-failed.max-retries=5
mp.messaging.incoming.payment-failed.retry-backoff.initial=1s 
mp.messaging.incoming.payment-failed.retry-backoff.max=30s 
mp.messaging.incoming.payment-failed.retry-backoff.factor=2.0
mp.messaging.incoming.payment-failed.value.deserializer=com.example.order.infrastructure.messaging.deserializer.PaymentFailedEventDeserializer
