quarkus.http.port=8081
app.payment.accepted=true
app.payment.crash=false
app.payment.delay=0

smallrye.jwt.path.groups=realm_access/roles
%dev.mp.jwt.verify.issuer=http://localhost:8180/realms/shopflow
%dev.mp.jwt.verify.publickey.location=http://localhost:8180/realms/shopflow/protocol/openid-connect/certs
%prod.mp.jwt.verify.issuer=http://localhost:8180/realms/shopflow
%prod.mp.jwt.verify.publickey.location=http://keycloak:8080/realms/shopflow/protocol/openid-connect/certs
quarkus.log.console.format=%d{HH:mm:ss} %-5p [payment-service] [%c{1}] [corrId=%X{correlationId}] [orderId=%X{orderId}] %s%e%n
quarkus.kafka.devservices.shared=true

# ─── Schema Registry ───────────────────────────────────────────────────────────
quarkus.apicurio-registry.devservices.port=8091
quarkus.apicurio-registry.devservices.shared=true
%prod.kafka.bootstrap.servers=kafka:9092
%prod.mp.messaging.connector.smallrye-kafka.apicurio.registry.url=http://apicurio-registry:8080

# ─── Producers ─────────────────────────────────────────────────────────────────
mp.messaging.outgoing.payment-completed.connector=smallrye-kafka
mp.messaging.outgoing.payment-completed.topic=payment-completed
mp.messaging.outgoing.payment-completed.value.serializer=io.apicurio.registry.serde.avro.AvroKafkaSerializer
mp.messaging.outgoing.payment-completed.apicurio.registry.auto-register=true
mp.messaging.outgoing.payment-completed.apicurio.registry.artifact-id=payment-completed-value

mp.messaging.outgoing.payment-failed.connector=smallrye-kafka
mp.messaging.outgoing.payment-failed.topic=payment-failed
mp.messaging.outgoing.payment-failed.value.serializer=io.apicurio.registry.serde.avro.AvroKafkaSerializer
mp.messaging.outgoing.payment-failed.apicurio.registry.auto-register=true
mp.messaging.outgoing.payment-failed.apicurio.registry.artifact-id=payment-failed-value

mp.messaging.outgoing.payment-rollback-completed.connector=smallrye-kafka
mp.messaging.outgoing.payment-rollback-completed.topic=payment-rollback-completed
mp.messaging.outgoing.payment-rollback-completed.value.serializer=io.apicurio.registry.serde.avro.AvroKafkaSerializer
mp.messaging.outgoing.payment-rollback-completed.apicurio.registry.auto-register=true
mp.messaging.outgoing.payment-rollback-completed.apicurio.registry.artifact-id=payment-rollback-completed-value

# ─── Consumers ─────────────────────────────────────────────────────────────────
mp.messaging.incoming.payment-request.connector=smallrye-kafka
mp.messaging.incoming.payment-request.topic=payment-request
mp.messaging.incoming.payment-request.group.id=payment-service
mp.messaging.incoming.payment-request.value.deserializer=io.apicurio.registry.serde.avro.AvroKafkaDeserializer
mp.messaging.incoming.payment-request.apicurio.registry.use-specific-avro-reader=true
mp.messaging.incoming.payment-request.failure-strategy=dead-letter-queue
mp.messaging.incoming.payment-request.dead-letter-queue.topic=payment-request-dlq
mp.messaging.incoming.payment-request.dead-letter-queue.value.serializer=org.apache.kafka.common.serialization.ByteArraySerializer
mp.messaging.incoming.payment-request.max-retries=5
mp.messaging.incoming.payment-request.retry-backoff.initial=1s
mp.messaging.incoming.payment-request.retry-backoff.max=30s
mp.messaging.incoming.payment-request.retry-backoff.factor=2.0

mp.messaging.incoming.payment-rollback.connector=smallrye-kafka
mp.messaging.incoming.payment-rollback.topic=payment-rollback
mp.messaging.incoming.payment-rollback.group.id=payment-service
mp.messaging.incoming.payment-rollback.value.deserializer=io.apicurio.registry.serde.avro.AvroKafkaDeserializer
mp.messaging.incoming.payment-rollback.apicurio.registry.use-specific-avro-reader=true
mp.messaging.incoming.payment-rollback.failure-strategy=dead-letter-queue
mp.messaging.incoming.payment-rollback.dead-letter-queue.topic=payment-rollback-dlq
mp.messaging.incoming.payment-rollback.dead-letter-queue.value.serializer=org.apache.kafka.common.serialization.ByteArraySerializer
mp.messaging.incoming.payment-rollback.max-retries=5
mp.messaging.incoming.payment-rollback.retry-backoff.initial=1s
mp.messaging.incoming.payment-rollback.retry-backoff.max=30s
mp.messaging.incoming.payment-rollback.retry-backoff.factor=2.0
