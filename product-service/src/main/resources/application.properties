spring.application.name=product-service
logging.pattern.console=%d{HH:mm:ss} %-5p [product-service] [%c{1}] [corrId=%X{correlationId}] [orderId=%X{orderId}] %m%n
server.port=8084

spring.datasource.url=jdbc:postgresql://localhost:5432/product
spring.datasource.username=postgres
spring.datasource.password=postgres

spring.jpa.hibernate.ddl-auto=validate

spring.flyway.locations=classpath:db/migration

# Do not auto-run batch jobs on startup — jobs are triggered explicitly via REST
spring.batch.job.enabled=false

# JWT — JWK URI avoids OIDC discovery on startup (no Keycloak dependency at boot time)
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8180/realms/shopflow/protocol/openid-connect/certs