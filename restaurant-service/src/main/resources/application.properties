quarkus.http.port=8082
quarkus.kafka.devservices.shared=true

# ─── Schema Registry ───────────────────────────────────────────────────────────
quarkus.apicurio-registry.devservices.port=8091
quarkus.apicurio-registry.devservices.shared=true
%prod.mp.messaging.connector.smallrye-kafka.apicurio.registry.url=http://apicurio-registry:8091

# ─── Producers ─────────────────────────────────────────────────────────────────
mp.messaging.outgoing.restaurant-approved.connector=smallrye-kafka
mp.messaging.outgoing.restaurant-approved.topic=restaurant-approved
mp.messaging.outgoing.restaurant-approved.value.serializer=io.apicurio.registry.serde.avro.AvroKafkaSerializer
mp.messaging.outgoing.restaurant-approved.apicurio.registry.auto-register=true
mp.messaging.outgoing.restaurant-approved.apicurio.registry.artifact-id=restaurant-approved-value

mp.messaging.outgoing.restaurant-rejected.connector=smallrye-kafka
mp.messaging.outgoing.restaurant-rejected.topic=restaurant-rejected
mp.messaging.outgoing.restaurant-rejected.value.serializer=io.apicurio.registry.serde.avro.AvroKafkaSerializer
mp.messaging.outgoing.restaurant-rejected.apicurio.registry.auto-register=true
mp.messaging.outgoing.restaurant-rejected.apicurio.registry.artifact-id=restaurant-rejected-value

# ─── Consumers ─────────────────────────────────────────────────────────────────
mp.messaging.incoming.restaurant-request.connector=smallrye-kafka
mp.messaging.incoming.restaurant-request.topic=restaurant-request
mp.messaging.incoming.restaurant-request.group.id=restaurant-service
mp.messaging.incoming.restaurant-request.value.deserializer=io.apicurio.registry.serde.avro.AvroKafkaDeserializer
mp.messaging.incoming.restaurant-request.apicurio.registry.use-specific-avro-reader=true
mp.messaging.incoming.restaurant-request.failure-strategy=dead-letter-queue
mp.messaging.incoming.restaurant-request.dead-letter-queue.topic=restaurant-request-dlq
mp.messaging.incoming.restaurant-request.dead-letter-queue.value.serializer=org.apache.kafka.common.serialization.ByteArraySerializer
mp.messaging.incoming.restaurant-request.max-retries=5
mp.messaging.incoming.restaurant-request.retry-backoff.initial=1s
mp.messaging.incoming.restaurant-request.retry-backoff.max=30s
mp.messaging.incoming.restaurant-request.retry-backoff.factor=2.0
